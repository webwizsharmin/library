<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>library</title>

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="main-header">
      <div class="container header-content">
        <div class="logo">
          <i data-lucide="book"></i>
          <h1>Library</h1>
        </div>
        <button class="btn-primary" id="add-book-btn">
          <i data-lucide="plus"></i>
          <span>Add Book</span>
        </button>
      </div>
    </header>

    <main class="library-grid" id="library-display">
      <article class="card-featured card">
        <div class="card-content">
          <span class="badge">Currently Reading</span>
          <h2 class="book-title">Time Management</h2>
          <p class="book-author">by Brian Tracy</p>
          <div class="card-footer">
            <p class="pages">324 pages</p>
            <button class="status-toggle Reading">Read</button>
          </div>
        </div>
      </article>

      <article class="card">
        <div class="card-content">
          <h2 class="book-title">Atomic Habits</h2>
          <p class="book-author">by James Clear</p>
          <div class="card-footer">
            <p class="pages">245 pages</p>
            <button class="status-toggle unread">Unread</button>
          </div>
        </div>
      </article>

      <article class="card">
        <div class="card-content">
          <h2 class="book-title">Think and Grow Rich</h2>
          <p class="book-author">by Nepolean Hill</p>
          <div class="card-footer">
            <p class="pages">345 pages</p>
            <button class="status-toggle Reading">Read</button>
          </div>
        </div>
      </article>

      <article class="card">
        <div class="card-content">
          <h2 class="book-title">You Can Win</h2>
          <p class="book-author">by Shiv Khera</p>
          <div class="card-footer">
            <p class="pages">413 pages</p>
            <button class="status-toggle unread">Unread</button>
          </div>
        </div>
      </article>
    </main>

    <dialog id="book-modal" class="modal">
      <div class="modal-content">
        <header class="modal-header">
          <h2>Add New Book</h2>
          <button id="close-modal" class="btn-icon">
            <i data-lucide="x"></i>
          </button>
        </header>

        <form id="book-form" method="dialog">
          <div class="form-group">
            <label for="title">Book Title</label>
            <input
              type="text"
              id="title"
              placeholder="e.g. Atomic Habits"
              required
            />
          </div>

          <div class="form-group">
            <label for="author">Author</label>
            <input type="text" id="author" placeholder="James Clear" required />
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="pages">Pages</label>
              <input type="number" id="pages" placeholder="320" required />
            </div>

            <div class="form-group checkbox-group">
              <label class="switch">
                <input type="checkbox" id="isRead" />
                <span class="slider"></span>
              </label>
              <span>Have you read it?</span>
            </div>
          </div>

          <button type="submit" class="btn-primary full-width">
            Add to Collections
          </button>
        </form>
      </div>
    </dialog>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="./app.js"></script>
  </body>
</html>
